services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: decay-pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:${VOLUME_PATH}

volumes:
  postgres_data: