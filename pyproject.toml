[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decay-engine"
version = "0.1.0"
description = "Keep an AI agent's long-term memory store clean over time."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yuvraj Rathva" }]
keywords = [
    "ai",
    "agents",
    "memory",
    "vector-database",
    "chroma",
    "pgvector",
    "postgres",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

# The core is deliberately dependency-free. Backend support is opt-in below, so
# installing decay-engine never pulls a database driver you do not use.
dependencies = []

[project.optional-dependencies]
chroma = ["chromadb>=0.4"]
pgvector = ["psycopg[binary]>=3.1"]
all = ["decay-engine[chroma,pgvector]"]
dev = ["decay-engine[all]", "pytest>=7", "build>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["decay_engine*"]

[tool.setuptools.package-data]
# PEP 561: the package is fully annotated, so advertise the types to checkers.
decay_engine = ["py.typed"]

[tool.pytest.ini_options]
# Relative, so the suite also runs from a directory holding only the tests.
testpaths = ["tests"]
